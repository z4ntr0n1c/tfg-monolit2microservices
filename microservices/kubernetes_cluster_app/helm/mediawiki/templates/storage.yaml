# PersistentVolume for MySQL
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-mysql-pv
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    component: mysql
spec:
  capacity:
    storage: 10Gi  
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce 
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.persistentVolume.storageClass }}
  hostPath:
    path: /vagrant/data/mysql

---

# PersistentVolumeClaim for MySQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-mysql-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    component: mysql
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistentVolume.storageClass }}
  resources:
    requests:
      storage: 10Gi
      
