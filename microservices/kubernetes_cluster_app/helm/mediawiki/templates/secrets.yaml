# Secrets are now managed by HashiCorp Vault (dev mode).
# The Vault Agent Injector sidecar injects credentials at runtime
# into /vault/secrets/ inside each pod via the annotations on the
# pod template in deployment.yaml.
#
# Vault paths used:
#   secret/data/mediawiki/mysql  → MYSQL_ROOT_PASSWORD, MYSQL_DATABASE,
#                                   MYSQL_USER, MYSQL_PASSWORD
#   secret/data/mediawiki/app    → MW_SECRET_KEY, MW_UPGRADE_KEY
#
# The Kubernetes Secret object that previously stored base64-encoded
# credentials has been removed intentionally.
