apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-apache
  labels:
    app: {{ .Chart.Name }}
    component: apache
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.autoscaling.minReplicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: apache
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: apache
    spec:
      containers:
      - name: apache
        image: {{ .Values.apache.image }}
        ports:
        - containerPort: {{ .Values.apache.port }}
        volumeMounts:
        - name: apache-config
          mountPath: /usr/local/apache2/conf/httpd.conf
          subPath: httpd.conf
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m" 
      volumes:
      - name: apache-config
        configMap:
          name: {{ .Release.Name }}-apache-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mysql
  labels:
    app: {{ .Chart.Name }}
    component: mysql
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.autoscaling.minReplicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: mysql
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: mysql
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "mediawiki"
        # Render MySQL secrets as a sourceable shell env file
        vault.hashicorp.com/agent-inject-secret-mysql.env: "secret/data/mediawiki/mysql"
        vault.hashicorp.com/agent-inject-template-mysql.env: |
          {{`{{- with secret "secret/data/mediawiki/mysql" -}}
          export MYSQL_ROOT_PASSWORD="{{ .Data.data.root_password }}"
          export MYSQL_DATABASE="{{ .Data.data.database }}"
          export MYSQL_USER="{{ .Data.data.user }}"
          export MYSQL_PASSWORD="{{ .Data.data.password }}"
          {{- end }}`}}
    spec:
      serviceAccountName: mediawiki-sa
      containers:
      - name: mysql
        image: {{ .Values.mysql.image }}
        # Source the Vault-injected env file before starting mysqld
        command: ["/bin/sh", "-c"]
        args:
          - |
            . /vault/secrets/mysql.env
            exec docker-entrypoint.sh mysqld
        ports:
        - containerPort: {{ .Values.mysql.port }}
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-config
          mountPath: /etc/mysql/conf.d/my.cnf
          subPath: my.cnf
        securityContext:
          runAsUser: 1000
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-mysql-pvc
      - name: mysql-config
        configMap:
          name: {{ .Release.Name }}-mysql-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-php
  labels:
    app: {{ .Chart.Name }}
    component: php
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.autoscaling.minReplicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: php
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: php
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "mediawiki"
        # DB credentials env file
        vault.hashicorp.com/agent-inject-secret-db.env: "secret/data/mediawiki/mysql"
        vault.hashicorp.com/agent-inject-template-db.env: |
          {{`{{- with secret "secret/data/mediawiki/mysql" -}}
          export MYSQL_DATABASE="{{ .Data.data.database }}"
          export MYSQL_USER="{{ .Data.data.user }}"
          export MYSQL_PASSWORD="{{ .Data.data.password }}"
          {{- end }}`}}
        # App secrets env file (wgSecretKey, wgUpgradeKey)
        vault.hashicorp.com/agent-inject-secret-app.env: "secret/data/mediawiki/app"
        vault.hashicorp.com/agent-inject-template-app.env: |
          {{`{{- with secret "secret/data/mediawiki/app" -}}
          export MW_SECRET_KEY="{{ .Data.data.secret_key }}"
          export MW_UPGRADE_KEY="{{ .Data.data.upgrade_key }}"
          {{- end }}`}}
    spec:
      serviceAccountName: mediawiki-sa
      containers:
      - name: php
        image: {{ .Values.php.image }}
        ports:
        - containerPort: {{ .Values.php.port }}
        # Source both Vault env files then start php-fpm
        command: ["/bin/sh", "-c"]
        args:
          - |
            . /vault/secrets/db.env
            . /vault/secrets/app.env
            exec php-fpm
        env:
        - name: PHP_MEMORY_LIMIT
          value: "{{ .Values.php.memoryLimit }}"
        - name: PHP_MAX_EXECUTION_TIME
          value: "{{ .Values.php.maxExecutionTime }}"
        - name: DB_SERVER
          value: "{{ .Release.Name }}-mysql-service.{{ .Values.namespace }}"
        volumeMounts:
        - name: php-fpm-config
          mountPath: /usr/local/etc/php-fpm.d/www.conf
          subPath: www.conf
        - name: mediawiki-volume
          mountPath: /var/www/html/images
        - name: mediawiki-localsettings
          mountPath: /var/www/html/LocalSettings.php
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      volumes:
      - name: php-fpm-config
        configMap:
          name: {{ .Release.Name }}-php-fpm-config
      - name: mediawiki-volume
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-php-pvc
      - name: mediawiki-localsettings
        hostPath:
          path: /vagrant/data/php/mediawiki/LocalSettings.php
