apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-apache
  labels:
    app: {{ .Chart.Name }}
    component: apache
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.autoscaling.minReplicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: apache
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: apache
    spec:
      containers:
      - name: apache
        image: {{ .Values.apache.image }}
        ports:
        - containerPort: {{ .Values.apache.port }}
        volumeMounts:
        - name: apache-config
          mountPath: /usr/local/apache2/conf/httpd.conf
          subPath: httpd.conf
      volumes:
      - name: apache-config
        configMap:
          name: {{ .Release.Name }}-apache-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mysql
  labels:
    app: {{ .Chart.Name }}
    component: mysql
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.autoscaling.minReplicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: mysql
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: mysql
    spec:
      containers:
      - name: mysql
        image: {{ .Values.mysql.image }}
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-mysql-secrets
              key: mysql-root-password
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-mysql-secrets
              key: mysql-database
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-mysql-secrets
              key: mysql-user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-mysql-secrets
              key: mysql-password
        ports:
        - containerPort: {{ .Values.mysql.port }}
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-config
          mountPath: /etc/mysql/conf.d/my.cnf
          subPath: my.cnf
        securityContext:
          runAsUser: 1000
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-mysql-pvc
      - name: mysql-config
        configMap:
          name: {{ .Release.Name }}-mysql-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-php
  labels:
    app: {{ .Chart.Name }}
    component: php
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.autoscaling.minReplicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: php
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: php
    spec:
      containers:
      - name: php
        image: {{ .Values.php.image }}
        ports:
        - containerPort: {{ .Values.php.port }}
        env:
        - name: PHP_MEMORY_LIMIT
          value: "{{ .Values.php.memoryLimit }}"
        - name: PHP_MAX_EXECUTION_TIME
          value: "{{ .Values.php.maxExecutionTime }}"
        - name: DB_SERVER
          value: "{{ .Release.Name }}-mysql-service.{{ .Values.namespace }}"
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-mysql-secrets
              key: mysql-database
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-mysql-secrets
              key: mysql-user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-mysql-secrets
              key: mysql-password
        volumeMounts:
        - name: php-data
          mountPath: /var/www/html
        - name: mediawiki-settings
          mountPath: /var/www/html/LocalSettings.php
          subPath: LocalSettings.php  
      volumes:
      - name: php-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-php-pvc
      - name: mediawiki-settings
        configMap:
          name: {{ .Release.Name }}-mediawiki-settings    