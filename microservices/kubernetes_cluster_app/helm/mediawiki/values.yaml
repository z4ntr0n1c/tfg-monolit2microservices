namespace: "mediawiki"

persistentVolume:
  storageClass: "default"

apache:
  image: httpd:latest
  port: 80
  targetPort: 80
  nodePort: 30080


mysql:
  image: mysql:5.7
  port: 3306
  targetPort: 3306
  rootPassword: "U3VwM3JTM2NyM3RSMDBUUDQzNDQwNXcwckQh"
  database: d2lraWRi
  user: d2lraXVzZXI=
  password: "VzFrMVAjNHNzdzByZAo="
  mycnfSettings:
    innodb_use_native_aio: "0"

php:
  image: php:8.1-fpm
  port: 9000
  targetPort: 9000
  memoryLimit: "256M"
  maxExecutionTime: 120
  uploadMaxFilesize: "20M"
  postMaxSize: "25M"
  extensions:
    - ctype
    - dom
    - iconv
    - libxml
    - openssl
    - gd
    - mbstring
    - xml
    - intl
    - json
    - curl
    - zip
    - opcache
    - fileinfo
  iniSettings:
    error_reporting: "E_ALL & ~E_NOTICE & ~E_DEPRECATED"
    display_errors: "Off"
    log_errors: "On"
    opcache_enable: "1"
    session.save_handler: "files"
    session.save_path: "/tmp"
  fpmSettings:
    user: "www-data"
    group: "www-data"
    log_level: "notice"
    pm: "dynamic"
    pm_max_children: "10"
    pm_start_servers: "2"
    pm_min_spare_servers: "1"
    pm_max_spare_servers: "3"
    

autoscaling:
  enabled: true 
  minReplicas: 1 
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80 
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  annotations: 
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: "localhost"
      paths:
        - path: "/"
          pathType: Prefix
