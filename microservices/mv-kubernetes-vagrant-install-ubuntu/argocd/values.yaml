apiVersion: argoproj.io/v1alpha1 
kind: Application 
metadata: 
  name: app-of-apps 
spec: 
  destination: 
    server: https://kubernetes.default.svc 
    namespace: argocd 
  source: 
    repoURL: 'https://github.com/my-org/helm-charts' 
    path: 'apps' 
    targetRevision: HEAD 
  project: default
