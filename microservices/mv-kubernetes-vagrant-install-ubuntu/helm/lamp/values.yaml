namespace: "lamp"

persistentVolume:
  storageClass: "default"

apache:
  image: httpd:2.4
  port: 80
  targetPort: 80
  nodePort: 30080

mysql:
  image: mysql:5.7
  port: 3306
  targetPort: 3306
  rootPassword: "Sup3rS3cr3tR00TP4$$w0rD!"
  database: wikidb
  user: wikiuser
  password: "W1k1P4$$w0rd."

php:
  image: php:8.1-fpm
  port: 9000
  targetPort: 9000
  memoryLimit: "256M"
  maxExecutionTime: 120
  uploadMaxFilesize: "20M"
  postMaxSize: "25M"
  extensions:
    - gd
    - mbstring
    - xml
    - intl
    - json
    - curl
    - zip
    - opcache
    - fileinfo
  iniSettings:
    error_reporting: "E_ALL & ~E_NOTICE & ~E_DEPRECATED"
    display_errors: "Off"
    log_errors: "On"
    opcache_enable: "1"
    session.save_handler: "files"
    session.save_path: "/tmp"

autoscaling:
  enabled: true 
  minReplicas: 1 
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80 
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  annotations: 
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: "localhost"
      paths:
        - path: "/"
          pathType: Prefix
