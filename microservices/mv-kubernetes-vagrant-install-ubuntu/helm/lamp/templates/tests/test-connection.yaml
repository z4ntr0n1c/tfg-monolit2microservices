apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "lamp.fullname" . }}-test-connection"
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lamp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "lamp.fullname" . }}-apache-service:{{ .Values.apache.port }}']
  restartPolicy: Never